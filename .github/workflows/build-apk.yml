name: Build APK

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Tag to publish as a GitHub Release (e.g. v1.15). Leave empty to just build."
        required: false
        type: string

permissions:
  contents: write

jobs:
  # Normale Branch-Pushes: nur ein Debug-Build zur Kontrolle.
  # Bewusst OHNE Zugriff auf die Signier-Secrets.
  debug:
    if: github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: plainvoice-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Room exportiert das Schema beim Bauen. Es gehoert ins Repo, damit
      # kuenftige Migrationen dagegen geprueft werden koennen.
      - name: Upload Room-Schema
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas/
          if-no-files-found: warn

  # Signierte Artefakte nur bei Tag-Push oder manuellem Start.
  # Nur dieser Job sieht den Keystore.
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Keystore bereitstellen
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 fehlt - ohne Keystore kein signiertes Release."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Signiertes APK und AAB bauen
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Signatur pruefen
        run: |
          # Es liegen mehrere build-tools-Versionen im SDK - die neueste nehmen.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner nicht gefunden unter $ANDROID_HOME/build-tools/"
            exit 1
          fi
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -1)
          echo "apksigner: $APKSIGNER"
          echo "APK:       $APK"
          "$APKSIGNER" verify --print-certs "$APK"

      - name: Keystore entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: plainvoice-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # Bewusst KEIN GitHub-Release: Die fertige App wird ueber Gumroad
      # verkauft. Bliebe hier ein Release mit angehaengter APK stehen, waere
      # das Produkt zwei Klicks vom oeffentlichen Repo entfernt gratis zu haben.
      # Die Artefakte oben genuegen, um den Build selbst herunterzuladen.
